name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.find.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          scripts=$(find . -mindepth 2 -maxdepth 2 -name package.json -printf '%h\n' | sed 's|^\./||' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    if: needs.discover.outputs.scripts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJson(needs.discover.outputs.scripts) }}
    defaults:
      run:
        working-directory: ${{ matrix.script }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run validate:prompts
        if: hashFiles(format('{0}/prompts/library.json', matrix.script)) != ''
      - name: Build
        run: |
          if jq -e '.scripts.build' package.json >/dev/null; then bun run build; fi
      - uses: actions/upload-artifact@v7
        if: hashFiles(format('{0}/dist/*', matrix.script)) != ''
        with:
          name: ${{ matrix.script }}
          path: ${{ matrix.script }}/dist/*
          if-no-files-found: error
