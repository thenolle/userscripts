name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          packages=$(jq -c '[.workspaces[] | {dir: ., name: gsub("/"; "-")}]' package.json)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run validate:prompts
        if: hashFiles(format('{0}/prompts/library.json', matrix.package.dir)) != ''
      - name: Build
        run: |
          if jq -e '.scripts.build' package.json >/dev/null; then bun run build; fi
      - uses: actions/upload-artifact@v7
        if: hashFiles(format('{0}/dist/*', matrix.package.dir)) != ''
        with:
          name: ${{ matrix.package.name }}
          path: ${{ matrix.package.dir }}/dist/*
          if-no-files-found: error
